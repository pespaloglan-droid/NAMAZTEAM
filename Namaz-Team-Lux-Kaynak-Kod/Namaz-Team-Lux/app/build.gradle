plugins { id 'com.android.application' }
android {
 namespace 'com.namazteam.lux'
 compileSdk 35
 defaultConfig { applicationId 'com.namazteam.lux'; minSdk 26; targetSdk 34; versionCode 1; versionName '0.1.0-beta' }
 sourceSets { main { manifest.srcFile 'AndroidManifest.xml'; java.srcDirs = ['src']; res.srcDirs = ['res']; assets.srcDirs = ['assets'] } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
 buildTypes { release { minifyEnabled false } }
}
dependencies { implementation 'org.jsoup:jsoup:1.18.3' }
